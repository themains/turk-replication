name: Replication and manuscript
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make ci-docker
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: manuscript
          path: ms/main.pdf
          if-no-files-found: error
